on:
  push:
    branches: [main, master]
    paths: &r-cmd-check-paths
      - 'EDI/**/*.R'
      - 'EDI/**/*.Rd'
      - 'EDI/**/*.cpp'
      - 'EDI/**/*.h'
      - 'EDI/**/*.hpp'
      - 'EDI/DESCRIPTION'
      - 'EDI/NAMESPACE'
      - 'EDI/configure'
      - 'EDI/configure.win'
      - 'EDI/src/Makevars'
      - 'EDI/src/Makevars.win'
      - '.github/workflows/R-CMD-check.yaml'
  pull_request:
    branches: [main, master]
    paths: *r-cmd-check-paths

name: R-CMD-check

# Standard CRAN-style check matrix for the EDI R package (see
# EDI/DESCRIPTION). This repo also holds an unrelated Python-bindings
# subproject (python/, checked by build-wheels.yml) and paper-reproduction
# code -- every step below is pointed at working-directory: EDI
# accordingly, since EDI/DESCRIPTION isn't at the repo root.
#
# EDI links against RcppEigen/RcppNumerical (see LinkingTo in
# EDI/DESCRIPTION) and compiles a large src/ tree of C++ kernels, so this
# is a real compiled-package check, not just a lint pass -- worth running
# across the full macOS/Windows/Linux x devel/release/oldrel-1 matrix to
# catch platform-specific compiler differences (MSVC vs. clang vs. gcc)
# that a single-OS check would miss. Runs with --as-cran (see the check step's
# `args:`) so CRAN-style checks (portable Makevars, Rd correctness, etc.) are
# enforced, not just a plain build+install.
#
# The `paths:` filter above only triggers this on pushes/PRs that touch R,
# Rd, or C++ sources (or the build-critical DESCRIPTION/NAMESPACE/configure/
# Makevars files, or this workflow itself) -- cosmetic changes (docs/*.md,
# benchmark/ scripts, the python/ subproject, package_metadata/ python
# integration scripts, etc.) don't spend CI minutes on a full compiled-package
# matrix build.
#
# Four jobs, covering what CRAN's own incoming checks do beyond a single
# --as-cran run on one machine:
#   - R-CMD-check:              the 5-platform/R-version --as-cran matrix.
#   - R-CMD-check-no-suggests:  same check with none of EDI's Suggests
#     packages installed (dependencies: NA), to catch an unconditional use of
#     an optional package that isn't properly guarded by requireNamespace()/
#     skip_if_not_installed() -- the main matrix always has every Suggests
#     package present, so it can't see this class of bug.
#   - R-CMD-check-sanitizers:   R-devel built with -fsanitize=address,undefined
#     (rocker/r-devel-san), to catch C++ undefined behavior in src/ that a
#     normal optimized build silently tolerates.
#   - R-CMD-check-valgrind:     R-devel under valgrind --use-valgrind, to
#     catch memory bugs (uninitialized reads, invalid frees) ASAN/UBSAN can
#     miss.

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Portable build: skips -march=native/-mtune=native/-fno-lto and the
      # CXXFLAGS override (see EDI/configure). Those are opt-in for local
      # performance-tuned builds (EDI_PORTABLE=0, the default) but would
      # otherwise trip "checking compilation flags in Makevars" here.
      EDI_PORTABLE: 1
      # --as-cran implies --run-donttest (reruns every example, including
      # \donttest{} blocks, in one combined session). That pass is fast and
      # clean on every other leg of this matrix (macOS: ~32s, all 3 Ubuntu
      # configs: ~67-68s) but has been observed to hang indefinitely on
      # windows-latest specifically -- a run on 2026-08-09 sat in "checking
      # examples with --run-donttest" for 5.5+ hours before GitHub's own
      # hard 6h job timeout killed it, with no single culprit example
      # isolatable (unlike the earlier Windows-only GLPK-solver test hang;
      # see test-fixed-design-optimal-blocks.R's skip_on_os("windows")).
      # Since the other 4 legs already exercise every \donttest{} example
      # successfully, disabling it only here (rather than dropping --as-cran
      # entirely) keeps that coverage while avoiding a repeat multi-hour
      # stuck job. See https://forum.posit.co/t/r-cmd-check-r-4-0-0-now-runs-donttest-how-to-proceed-with-long-running-examples/64493
      # for _R_CHECK_DONTTEST_EXAMPLES_ overriding --as-cran's default.
      _R_CHECK_DONTTEST_EXAMPLES_: ${{ matrix.config.os == 'windows-latest' && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: EDI
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: EDI
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # Fail on NOTEs too, not just WARNINGs/ERRORs. This action already
          # sets _R_CHECK_CRAN_INCOMING_=false by default (see its action.yaml),
          # which suppresses the one NOTE that's genuinely unavoidable pre-CRAN
          # ("New submission") -- so "note" here means "fail on anything we can
          # actually still do something about."
          error-on: '"note"'

  # CRAN also verifies a package works with only its hard dependencies
  # (Depends/Imports/LinkingTo) present -- catching an unconditional use of a
  # Suggested package that isn't properly guarded by requireNamespace()/
  # skip_if_not_installed(). The main matrix job above always has every
  # Suggests package installed, so it can't catch this class of bug; this
  # job deliberately installs none of them (dependencies: NA is pak's "hard
  # dependencies only" spec) and sets _R_CHECK_SUGGESTS_ONLY_ to match.
  R-CMD-check-no-suggests:
    runs-on: ubuntu-latest
    name: ubuntu-latest (release, no Suggests)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      EDI_PORTABLE: 1
      _R_CHECK_SUGGESTS_ONLY_: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: EDI
          extra-packages: any::rcmdcheck
          dependencies: 'NA'

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: EDI
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"note"'

  # ASAN/UBSAN sanitizer build. Catches C++ undefined behavior (out-of-bounds
  # access, sign/integer overflow, misaligned access, use-after-free, etc.)
  # in the src/ kernels that a normal optimized build silently tolerates --
  # exactly the class of bug the main matrix job's --as-cran run cannot see,
  # since neither gcc/clang nor R CMD check instrument for it by default.
  # rocker/r-devel-san ships R-devel pre-built with -fsanitize=address,undefined
  # as its normal R/Rscript, so this otherwise mirrors a plain R CMD check.
  # Given the whole test suite runs under sanitizer instrumentation (slower
  # than a normal build, though not as extreme as valgrind), this has its own
  # generous-but-bounded timeout so a genuine hang can't repeat the >6-hour
  # stuck-job incident the Windows job hit before (see git history).
  R-CMD-check-sanitizers:
    runs-on: ubuntu-latest
    name: R-devel (ASAN/UBSAN)
    timeout-minutes: 180
    container:
      image: rocker/r-devel-san

    env:
      EDI_PORTABLE: 1
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: "Install libuv (system dependency of the 'fs' package, itself a transitive dependency of testthat via pkgload -- rocker/r-devel-san is a bare-bones image that doesn't include it, unlike e.g. rocker/r-devel, causing \"ERROR: configuration failed for package 'fs'\" -> cascading pkgload/testthat install failures)"
        run: apt-get update && apt-get install -y libuv1-dev

      - name: Install EDI's Depends/Imports/LinkingTo (Suggests skipped -- not needed to catch memory bugs in the core kernels, and roughly doubles this already-slow job otherwise)
        working-directory: EDI
        run: |
          RDscript -e 'install.packages(c("R6","checkmate","Rcpp","RcppEigen","RcppNumerical","data.table","survival","missRanger","missForest","numDeriv","digest","methods","MASS","RhpcBLASctl","randomizr","testthat"), repos = "https://cloud.r-project.org")'

      - name: Build
        working-directory: EDI
        run: RD CMD build --no-build-vignettes --no-manual .

      - name: Check under ASAN/UBSAN
        working-directory: EDI
        run: RD CMD check --no-manual --no-build-vignettes --as-cran EDI_*.tar.gz

  # Valgrind memcheck build. Catches memory bugs (uninitialized reads,
  # out-of-bounds access, use-after-free, invalid frees) in the src/ kernels
  # that ASAN/UBSAN above can miss and a normal build can't see at all.
  # valgrind doesn't need a specially-instrumented R build -- it works on any
  # binary -- so this uses the same actively-maintained rocker/r-devel base
  # image as the sanitizers job above rather than a prebuilt "valgrind R"
  # image like wch1/r-debug's RDvalgrind, which has been unmaintained since
  # 2019.
  #
  # Valgrind instrumentation is dramatically slower than ASAN/UBSAN (itself
  # slower than a normal build), so this runs the full check -- tests
  # included, not just examples -- under a generous but hard-capped timeout.
  # GitHub Actions itself caps hosted-runner jobs at 6h regardless of
  # timeout-minutes, so 350 leaves a few minutes of headroom for
  # checkout/setup before that external cutoff turns a slow run into an
  # opaque kill instead of a clean, readable timeout failure.
  R-CMD-check-valgrind:
    runs-on: ubuntu-latest
    name: R-devel (valgrind)
    timeout-minutes: 350
    container:
      image: rocker/r-devel

    env:
      EDI_PORTABLE: 1
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind and libuv (libuv is a system dependency of the 'fs' package, itself a transitive dependency of testthat via pkgload -- rocker/r-devel is a bare-bones image that doesn't include it, see the sanitizers job's Install libuv step for the failure this causes if skipped)
        run: apt-get update && apt-get install -y valgrind libuv1-dev

      - name: Install EDI's Depends/Imports/LinkingTo (Suggests skipped -- not needed to catch memory bugs in the core kernels, and would multiply the runtime of an already-very-slow job)
        working-directory: EDI
        run: |
          RDscript -e 'install.packages(c("R6","checkmate","Rcpp","RcppEigen","RcppNumerical","data.table","survival","missRanger","missForest","numDeriv","digest","methods","MASS","RhpcBLASctl","randomizr","testthat"), repos = "https://cloud.r-project.org")'

      - name: Build
        working-directory: EDI
        run: RD CMD build --no-build-vignettes --no-manual .

      - name: Check under valgrind
        working-directory: EDI
        run: RD CMD check --no-manual --no-build-vignettes --as-cran --use-valgrind EDI_*.tar.gz

