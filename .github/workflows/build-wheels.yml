name: Build edi_kernels wheels

# Builds portable (non -march=native) wheels for the edi_kernels Python
# package -- see python/pyproject.toml's [tool.cibuildwheel] and
# package_metadata/python_bindings_package_spec.md's "Building portable
# wheels" checklist. On a manual (workflow_dispatch) run, this only builds
# and uploads wheels/sdist as CI artifacts. On an actual `py-v*` tag push,
# the `publish` job additionally uploads them to PyPI via Trusted
# Publishing (OIDC, no stored API token) -- see that doc's "Publishing"
# checklist item. Kept as one workflow (build jobs + a tag-gated publish
# job) rather than a second workflow re-running the whole build matrix,
# per cibuildwheel's own recommended pattern.
#
# The package root is python/ (pyproject.toml lives there, not at the repo
# root), since this repo also holds the unrelated R package (EDI/) and
# paper reproduction code -- every cibuildwheel step below is pointed at
# package-dir: python accordingly.
#
# One-time manual setup required before the first `py-v*` tag push (not
# something this workflow file can do on its own): register this repo as a
# Trusted Publisher for the `edi_kernels` PyPI project at
# https://pypi.org/manage/project/edi_kernels/settings/publishing/ (or, for
# a brand-new project name, https://pypi.org/manage/account/publishing/),
# with workflow name `build-wheels.yml` and environment name `pypi`
# (matching the `publish` job's `environment:` below).

on:
  push:
    tags:
      - "py-v*"
    # Runs on main too, but only when a push actually touches something that
    # can affect the wheel build or its C++ kernels -- without the `paths`
    # filter, every commit to main (including R-only changes, which are most
    # of them) would trigger the full 3-OS wheel matrix build. The `publish`
    # job below still only fires on an actual tag push, so a plain main push
    # can never trigger a PyPI upload.
    #
    # EDI/src/**/*.{cpp,h,hpp} is included because CMakeLists.txt compiles
    # those kernel sources directly into this extension (EDI/src is their
    # single source of truth, per the comment there) -- a change there is a
    # C++ change to this build even though the file lives under EDI/. Plain
    # R sources/docs (EDI/R, EDI/man, *.md reports, benchmark/*.R) do not
    # affect this build and are intentionally left out; **/*.py picks up
    # both the python/ package and cross-language integration scripts like
    # benchmark/benchmark_model_fits_python.py without also matching its
    # sibling .R/.md/.html files in that same directory.
    branches:
      - main
    paths:
      - "python/**"
      - "EDI/src/**/*.cpp"
      - "EDI/src/**/*.h"
      - "EDI/src/**/*.hpp"
      - "**/*.py"
      - ".github/workflows/build-wheels.yml"
  workflow_dispatch: {}

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.4
        with:
          package-dir: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        run: pipx run build --sdist --outdir dist python

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only an actual tag push publishes -- a workflow_dispatch run (e.g. to
    # test the build matrix) never uploads anywhere.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/py-v')
    environment:
      name: pypi
      url: https://pypi.org/p/edi_kernels
    permissions:
      # Trusted Publishing: this is the OIDC token PyPI exchanges for a
      # short-lived upload credential -- no PYPI_API_TOKEN secret needed or
      # wanted. See the one-time setup note at the top of this file.
      id-token: write

    steps:
      - name: Download all wheel + sdist artifacts into dist/
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
