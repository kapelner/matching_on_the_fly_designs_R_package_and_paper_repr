[build-system]
# scipy-openblas32 is Windows-only (see CMakeLists.txt's BLAS-fallback
# comment and [tool.cibuildwheel.windows] below) and, critically, must be
# declared here rather than only installed via cibuildwheel's
# before-build: `pip wheel`/`python -m build` create their own isolated
# PEP 517 build environment for the build backend (scikit_build_core.build)
# separate from cibuildwheel's own venv, so a before-build-only install is
# invisible to the CMake configure step that actually needs it
# (`import scipy_openblas32` against Python_EXECUTABLE failed with "not
# installed in <isolated build venv> either" on windows-latest CI on
# 2026-08-09). Declaring it here lets pip's own isolated-build-env
# resolution install it where CMake will actually look, matching how
# numpy/scipy handle the same problem.
requires = ["scikit-build-core>=0.10", "pybind11>=2.13", "scipy-openblas32; sys_platform == 'win32'"]
build-backend = "scikit_build_core.build"

[project]
name = "edi_kernels"
version = "1.0.0"
description = "Python bindings for EDI's C++ model-fitting kernels (pybind11, no R/Rcpp dependency)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0", "scipy>=1.10"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/edi_kernels"]

[tool.scikit-build.cmake.define]
EDI_PY_PORTABLE = "OFF"

# Wheels built by cibuildwheel (see below) leave this machine, so they must
# never bake in -march=native. This does NOT change the default for a plain
# local `pip install .` (still OFF, i.e. -march=native, for local-dev
# speed) -- cibuildwheel overrides it per-build via `config-settings`
# below, per this doc's own "Building portable wheels" checklist, which
# explicitly prefers that over flipping the pyproject.toml-wide default.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
build-verbosity = 1
config-settings = { "cmake.define.EDI_PY_PORTABLE" = "ON" }
test-command = "python -m pytest {project}/python/tests -q"
test-extras = ["test"]

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8 based) rather than the manylinux2014 default:
# EDI/src is built as C++20 (CMakeLists.txt CMAKE_CXX_STANDARD), which
# manylinux2014's stock devtoolset compiler doesn't reliably support.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# No BLAS is preinstalled in manylinux containers at all (see
# CMakeLists.txt's find_package(BLAS) comment) -- openblas-devel provides
# it via dnf (this image's package manager; NOT apt-get, which manylinux
# images don't have despite being a common copy-paste default elsewhere).
before-all = "dnf install -y openblas-devel || yum install -y openblas-devel"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# BLAS: macOS ships the Accelerate framework, which CMake's FindBLAS
# detects automatically -- no install needed. libomp is separate (Apple
# clang doesn't bundle OpenMP); installed so OpenMP::OpenMP_CXX
# (CMakeLists.txt's optional find_package(OpenMP)) is actually found rather
# than silently building single-threaded.
before-all = "brew install libomp"

[tool.cibuildwheel.windows]
# No system package manager and no Accelerate-equivalent BLAS on Windows --
# fall back to the pip-installable scipy-openblas32 package (see
# CMakeLists.txt's find_package(BLAS) fallback, same package numpy/scipy/
# scikit-learn's own cibuildwheel configs use for this exact problem).
# scipy-openblas32 is ALSO declared in [build-system] requires above -- that
# copy is what CMake's configure step sees (a separate, isolated PEP 517
# build env; see that comment for why a before-build-only install doesn't
# reach it). This before-build install is a second, deliberately redundant
# copy for a third, different venv: the one that runs repair-wheel-command
# below, which needs to `import scipy_openblas32` to find its DLL directory
# for delvewheel's --add-path (a plain `delvewheel repair` scans the wheel's
# DLL imports via the normal OS search path, which doesn't know about
# scipy_openblas32's install location -- that only gets added at runtime via
# its own __init__.py's os.add_dll_directory() call when the module is
# imported by user code, never by delvewheel's standalone scan -- confirmed
# by "FileNotFoundError: Unable to find library: libscipy_openblas.dll" on
# windows-latest CI on 2026-08-10).
before-build = "pip install delvewheel scipy-openblas32"
repair-wheel-command = "python -c \"import scipy_openblas32, subprocess, sys; subprocess.run(['delvewheel', 'repair', '--add-path', scipy_openblas32.get_lib_dir(), '-w', sys.argv[1], sys.argv[2]], check=True)\" {dest_dir} {wheel}"
